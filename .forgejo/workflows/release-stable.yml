name: release-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version, for example v0.2.0
        required: true
        type: string
      promotion_channel:
        description: Exact source channel
        required: true
        default: beta
        type: string
      promotion_version:
        description: Exact source version, for example v0.2.0-beta.1
        required: true
        type: string
      publish:
        description: Publish when true; rehearse without mutation when false
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: PerishLab/actions/.forgejo/workflows/release-stable.yml@main
    with:
      product: crest
      version: ${{ inputs.version }}
      promotion_channel: ${{ inputs.promotion_channel }}
      promotion_version: ${{ inputs.promotion_version }}
      publish: ${{ inputs.publish }}
      npm_url: https://git.perish.top/api/packages/PerishLab/npm/
      smoke: .forgejo/scripts/smoke.sh
      guard_contexts: '["guard / guard (push)"]'
    secrets:
      npm_token: ${{ secrets.PACKAGE_RELEASE_TOKEN }}
