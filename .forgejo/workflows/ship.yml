name: ship

on:
  workflow_call:
    inputs:
      guard_contexts:
        description: JSON commit-status contexts proving the canonical source guard
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ship-${{ startsWith(github.ref, 'refs/heads/release/') && 'consensus' || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
      project: ${{ steps.plan.outputs.project }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_COMMIT: ${{ github.sha }}
      PLUMB_RELEASE_SOURCE: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install the Plumb this line is generated by
        shell: bash
        run: |
          set -eu
          held=$(curl -fsSL "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            curl -fsSL https://releases.plumb.perish.uk/manage.sh | sh -s -- install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            curl -fsSL https://releases.plumb.perish.uk/manage.sh | sh
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Plan this release
        id: plan
        shell: bash
        run: |
          set -eu
          if plumb release plan --help >/dev/null 2>&1; then
            plan=$(plumb release plan)
            PLUMB_RELEASE_VERSION=$(printf '%s' "$plan" | jq -r '.version')
            PLUMB_RELEASE_CHANNEL=$(printf '%s' "$plan" | jq -r '.channel')
            PLUMB_RELEASE_PROJECT=$(printf '%s' "$plan" | jq -c '.project')
          else
            PLUMB_RELEASE_VERSION=$(plumb release reference)
            export PLUMB_RELEASE_VERSION
            PLUMB_RELEASE_CHANNEL=$(plumb release channel)
            export PLUMB_RELEASE_CHANNEL
            plumb release source
            PLUMB_RELEASE_PROJECT=$(plumb release surface | jq -c '.project')
          fi
          export PLUMB_RELEASE_VERSION
          export PLUMB_RELEASE_CHANNEL
          {
            echo "channel=$PLUMB_RELEASE_CHANNEL"
            echo "commit=$PLUMB_RELEASE_COMMIT"
            echo "version=$PLUMB_RELEASE_VERSION"
            echo "targets=$(plumb ship binary matrix)"
            echo "project=$PLUMB_RELEASE_PROJECT"
          } >> "$GITHUB_OUTPUT"

  project:
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.project) }}
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLUMB_RELEASE_OUTPUT: .plumb-release/capsule
      PLUMB_RELEASE_CAPSULE: .plumb-release/capsule/capsule.json
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.registry_token }}
      PLUMB_SITE_TOKEN: ${{ secrets.site_token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install the Plumb this line is generated by
        shell: bash
        run: |
          set -eu
          held=$(curl -fsSL "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            curl -fsSL https://releases.plumb.perish.uk/manage.sh | sh -s -- install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            curl -fsSL https://releases.plumb.perish.uk/manage.sh | sh
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Install declared packages
        shell: bash
        run: |
          set -eu
          if test -f pnpm-lock.yaml; then
            corepack enable
            pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
          fi

      - name: Project one declared medium
        shell: bash
        run: |
          set -eu
          plumb ship ${{ matrix.medium }} ${{ matrix.prepare }}
          plumb ship ${{ matrix.medium }} publish

