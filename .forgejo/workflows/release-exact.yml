name: release-exact

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Exact non-stable channel
        required: true
        default: beta
        type: string
      version:
        description: Exact non-stable version, for example v0.2.0-beta.1
        required: true
        type: string
      publish:
        description: Publish when true; rehearse without mutation when false
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: PerishLab/actions/.forgejo/workflows/release-exact.yml@main
    with:
      product: crest
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      npm_url: https://git.perish.top/api/packages/PerishLab/npm/
      smoke: .forgejo/scripts/smoke.sh
      guard_contexts: '["guard / guard (push)"]'
    secrets:
      npm_token: ${{ secrets.PACKAGE_RELEASE_TOKEN }}
