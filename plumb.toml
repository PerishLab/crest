[layout]

[[layout.seat]]
path = "apps/*"
anchor = ["package.json"]
note = "Private static review applications, excluded from package publication."

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
note = "Publishable Node packages."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json", ".npmrc"]
note = "The pnpm workspace anchors."

[release]
product = "crest"
authority = "https://releases.crest.perish.uk"
skill = false

[release.npm]
registry = "https://npm.pkg.github.com/"
packages = ["@perishlab/crest"]

[lane]
repository = "PerishLab/crest"

[lane.app.crest]
path = "apps/review"
package = "crest-review"

[lane.app.crest.mapping]
provider = "cfworker"
access = "public"
account = "a6776d8a453d1b84d01576245a9c4f8d"
resource = "crest-development"

[lane.app.crest.binding.preview]
adaptor = "static"
capabilities = ["inspect", "build", "deploy", "dispose"]

[lane.app.crest.binding.preview.authorities]
authorization = "wharf"
publication = "wharf"

[lane.app.crest.binding."preview.design"]
adaptor = "static"
capabilities = ["inspect", "build", "deploy", "dispose"]

[lane.app.crest.binding."preview.design".authorities]
authorization = "wharf"
publication = "wharf"

[lane.app.crest.binding."preview.review"]
adaptor = "static"
capabilities = ["inspect", "build", "deploy", "dispose"]

[lane.app.crest.binding."preview.review".authorities]
authorization = "wharf"
publication = "wharf"
